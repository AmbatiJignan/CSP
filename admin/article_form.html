<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Editor – GreenGrow Admin</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Admin CSS -->
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <a href="dashboard.html" class="admin-sidebar-brand">
      <i class="bi bi-flower2 text-success fs-4"></i>
      <span>GreenGrow</span>
      <span class="badge-tag">Admin</span>
    </a>

    <div class="admin-nav-section-title">Core Management</div>
    <a href="dashboard.html" class="admin-nav-link">
      <i class="bi bi-speedometer2"></i>
      <span>Dashboard</span>
    </a>
    <a href="surveys.html" class="admin-nav-link">
      <i class="bi bi-clipboard2-data"></i>
      <span>Farmer Surveys</span>
    </a>
    <a href="articles.html" class="admin-nav-link active">
      <i class="bi bi-journal-richtext"></i>
      <span>Articles</span>
    </a>
    <a href="resources.html" class="admin-nav-link">
      <i class="bi bi-file-earmark-pdf"></i>
      <span>Resources & PDFs</span>
    </a>
    <a href="videos.html" class="admin-nav-link">
      <i class="bi bi-camera-video"></i>
      <span>Videos</span>
    </a>
    <a href="faqs.html" class="admin-nav-link">
      <i class="bi bi-question-circle"></i>
      <span>FAQs</span>
    </a>
    <a href="feedback.html" class="admin-nav-link">
      <i class="bi bi-chat-left-text"></i>
      <span>Feedback Inbox</span>
    </a>

    <div class="admin-nav-section-title">System & Security</div>
    <a href="users.html" class="admin-nav-link">
      <i class="bi bi-people"></i>
      <span>Admin Accounts</span>
    </a>
    <a href="audit_logs.html" class="admin-nav-link">
      <i class="bi bi-shield-check"></i>
      <span>Audit Trail</span>
    </a>

    <div class="mt-auto p-3 border-top border-secondary border-opacity-25">
      <a href="../index.html" class="admin-nav-link text-white-50">
        <i class="bi bi-box-arrow-up-right"></i>
        <span>View Public Site</span>
      </a>
    </div>
  </aside>

  <!-- Main Wrapper -->
  <div class="admin-main-wrapper">
    <!-- Topbar -->
    <header class="admin-topbar">
      <div class="d-flex align-items-center gap-3">
        <h4 class="admin-page-title" id="pageTitle">Create Educational Article</h4>
      </div>

      <div class="d-flex align-items-center gap-3">
        <div class="admin-user-pill">
          <i class="bi bi-person-circle text-success"></i>
          <span class="admin-user-name">GreenGrow Project Administrator</span>
          <span class="badge bg-secondary text-uppercase admin-user-role" style="font-size: 0.65rem;">superadmin</span>
        </div>
        <button class="btn btn-sm btn-outline-danger rounded-pill px-3 admin-logout-btn">
          <i class="bi bi-box-arrow-right me-1"></i>Logout
        </button>
      </div>
    </header>

    <!-- Admin Page Content -->
    <main class="admin-content">
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="admin-card">
            <div class="admin-card-header">
              <h5><i class="bi bi-pencil text-success me-2"></i><span id="formHeader">Article Editor</span></h5>
              <a href="articles.html" class="btn btn-sm btn-outline-secondary rounded-pill">
                <i class="bi bi-arrow-left me-1"></i>Back
              </a>
            </div>

            <div class="admin-card-body p-4">
              <div id="articleAlert"></div>

              <form id="articleForm">
                <div class="mb-3">
                  <label class="form-label small fw-bold">Article Title <span class="text-danger">*</span></label>
                  <input type="text" class="form-control" id="artTitle" required placeholder="e.g. Enhancing Soil Organic Carbon in Dryland Belts">
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label class="form-label small fw-bold">URL Slug <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="artSlug" required placeholder="enhancing-soil-organic-carbon">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-bold">Category</label>
                    <select class="form-select" id="artCategory">
                      <option value="Soil Health & Humus">Soil Health & Humus</option>
                      <option value="Organic Inputs & Biofertilisers">Organic Inputs & Biofertilisers</option>
                      <option value="Ecological Pest Defense">Ecological Pest Defense</option>
                      <option value="Water & Climate Resilience">Water & Climate Resilience</option>
                      <option value="Crop Advisory & Transition">Crop Advisory & Transition</option>
                    </select>
                  </div>
                </div>

                <div class="row g-3 mb-3">
                  <div class="col-md-6">
                    <label class="form-label small fw-bold">Author</label>
                    <input type="text" class="form-control" id="artAuthor" placeholder="GreenGrow Team" value="GreenGrow Team">
                  </div>
                  <div class="col-md-6">
                    <label class="form-label small fw-bold">Image URL (Optional)</label>
                    <input type="url" class="form-control" id="artImage" placeholder="https://example.com/image.jpg">
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label small fw-bold">Summary (Short teaser)</label>
                  <textarea class="form-control" id="artSummary" rows="2" placeholder="Brief summary of the article..."></textarea>
                </div>

                <div class="mb-4">
                  <label class="form-label small fw-bold">Article Content <span class="text-danger">*</span></label>
                  <textarea class="form-control" id="artContent" rows="12" required placeholder="Full educational article body text..."></textarea>
                </div>

                <div class="row g-3 mb-4">
                  <div class="col-md-6">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="artPublished" checked>
                      <label class="form-check-label small" for="artPublished">Publish immediately</label>
                    </div>
                  </div>
                  <div class="col-md-6">
                    <div class="form-check">
                      <input class="form-check-input" type="checkbox" id="artFeatured">
                      <label class="form-check-label small" for="artFeatured">Feature on Homepage</label>
                    </div>
                  </div>
                </div>

                <div class="d-flex gap-2">
                  <button type="submit" class="btn btn-primary-green px-4 rounded-pill fw-bold" id="saveArtBtn">
                    <i class="bi bi-check-lg me-1"></i>Save Article
                  </button>
                  <a href="articles.html" class="btn btn-outline-secondary px-4 rounded-pill">Cancel</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Data Store JS -->
  <script src="../js/data.js"></script>
  <!-- Admin Custom JS -->
  <script src="../js/admin.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const editId = urlParams.get("id");
      const titleInput = document.getElementById("artTitle");
      const slugInput = document.getElementById("artSlug");

      let editingArticle = null;
      if (editId && typeof DataStore !== "undefined") {
        const articles = DataStore.getArticles();
        editingArticle = articles.find(a => String(a.id) === String(editId));
        if (editingArticle) {
          document.getElementById("pageTitle").textContent = "Edit Article: " + editingArticle.title;
          document.getElementById("formHeader").textContent = "Edit Article: " + editingArticle.title;
          titleInput.value = editingArticle.title;
          slugInput.value = editingArticle.slug;
          document.getElementById("artCategory").value = editingArticle.category;
          document.getElementById("artAuthor").value = editingArticle.author || "GreenGrow Team";
          document.getElementById("artImage").value = editingArticle.image_url || "";
          document.getElementById("artSummary").value = editingArticle.summary || "";
          document.getElementById("artContent").value = editingArticle.content || "";
          document.getElementById("artPublished").checked = editingArticle.is_published;
          document.getElementById("artFeatured").checked = editingArticle.is_featured;
        }
      }

      if (!editingArticle) {
        titleInput.addEventListener("input", () => {
          slugInput.value = titleInput.value.toLowerCase()
            .replace(/[^\w\s-]/g, '')
            .replace(/[\s_-]+/g, '-')
            .replace(/^-+|-+$/g, '');
        });
      }

      document.getElementById("articleForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const articles = DataStore.getArticles();
        const title = titleInput.value.trim();

        const art = {
          id: editingArticle ? editingArticle.id : Date.now(),
          title: title,
          slug: slugInput.value.trim(),
          category: document.getElementById("artCategory").value,
          category_slug: document.getElementById("artCategory").value.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
          author: document.getElementById("artAuthor").value.trim() || "GreenGrow Team",
          image_url: document.getElementById("artImage").value.trim() || "",
          summary: document.getElementById("artSummary").value.trim() || null,
          content: document.getElementById("artContent").value,
          is_published: document.getElementById("artPublished").checked,
          is_featured: document.getElementById("artFeatured").checked,
          created_at: editingArticle ? editingArticle.created_at : new Date().toISOString().slice(0, 10),
          view_count: editingArticle ? editingArticle.view_count : 0
        };

        if (editingArticle) {
          const idx = articles.findIndex(a => a.id === editingArticle.id);
          if (idx !== -1) articles[idx] = art;
          DataStore.logAudit("UPDATE", "ARTICLE", art.id, `Updated article '${title}'`);
        } else {
          articles.unshift(art);
          DataStore.logAudit("CREATE", "ARTICLE", art.id, `Created article '${title}'`);
        }

        DataStore.saveArticles(articles);
        window.location.href = "articles.html";
      });
    });
  </script>
</body>
</html>

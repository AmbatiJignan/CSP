<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login – GreenGrow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/admin.css">
  <style>
    body {
      background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .login-box {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 1rem;
      padding: 2.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body>

  <div class="login-box">
    <div class="text-center mb-4">
      <div class="d-inline-flex p-3 bg-success bg-opacity-10 text-success rounded-circle mb-2 fs-2">
        <i class="bi bi-flower2"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">GreenGrow Portal</h3>
      <p class="text-muted small">Administration Console (Frontend Demonstration)</p>
    </div>

    <!-- Alert placeholder -->
    <div id="loginNotice">
      <div class="alert alert-info py-2 small mb-3">
        <i class="bi bi-info-circle me-1"></i><strong>Demo Mode:</strong> You can sign in using default user <code>admin</code> (any password).
      </div>
    </div>

    <form id="adminLoginForm">
      <div class="mb-3">
        <label for="adminUsername" class="form-label small fw-bold text-muted">Admin Username</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="adminUsername" required placeholder="Enter username" autocomplete="username" value="admin">
        </div>
      </div>

      <div class="mb-4">
        <label for="adminPassword" class="form-label small fw-bold text-muted">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="adminPassword" required placeholder="Enter password" autocomplete="current-password" value="AdminPass123!">
        </div>
      </div>

      <button type="submit" class="btn btn-success w-100 py-2 fw-bold rounded-pill">
        <i class="bi bi-box-arrow-in-right me-1"></i>Sign In to Dashboard
      </button>
    </form>

    <div class="mt-4 pt-3 border-top text-center">
      <a href="../index.html" class="small text-muted text-decoration-none">
        <i class="bi bi-arrow-left me-1"></i>Return to Public Website
      </a>
    </div>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
